<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Concurseiro - Gamifique seus estudos e conquiste sua aprovação! 🎯 Plataforma jovem e divertida para organizar seus estudos." />
    <meta name="theme-color" content="#FF7000" />
    <title>Concurseiro | Gamifique sua Aprovação 🚀</title>
    
    <!-- Preload das fontes para performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Script para adicionar interatividade sutil -->
    <script>
      // Adiciona emojis flutuantes ao clicar em botões (mais sutil)
      document.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.classList.contains('btn')) {
          const emojis = ['🎯', '✨', '💪', '🏆', '⭐'];
          const emoji = document.createElement('div');
          emoji.className = 'emoji-float';
          emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          emoji.style.left = e.clientX + 'px';
          emoji.style.top = e.clientY + 'px';
          document.body.appendChild(emoji);
          setTimeout(() => emoji.remove(), 4000);
        }
      });
    </script>
  </body>
</html>
