<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg 
  width="200" 
  height="60" 
  viewBox="0 0 200 60" 
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink">
  
  <!-- Definições de gradientes e filtros -->
  <defs>
    <!-- Gradiente principal laranja-amarelo -->
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFBD00;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente azul -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#004AAD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a6fd4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Sombra suave -->
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Grupo principal do logo -->
  <g id="logo-concurseiro">
    
    <!-- Ícone/Símbolo (livro estilizado com marca de check) -->
    <g id="icon" transform="translate(10, 10)">
      <!-- Livro aberto -->
      <path d="M 5 10 
               Q 15 5, 20 10
               L 20 35
               Q 15 30, 5 35
               Z" 
            fill="url(#blueGradient)" 
            opacity="0.9"/>
      
      <path d="M 35 10 
               Q 25 5, 20 10
               L 20 35
               Q 25 30, 35 35
               Z" 
            fill="#004AAD" 
            opacity="0.8"/>
      
      <!-- Marca de check/aprovação -->
      <circle cx="20" cy="20" r="8" fill="url(#orangeGradient)" opacity="0.95"/>
      <path d="M 16 20 L 18.5 22.5 L 24 17" 
            stroke="white" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            fill="none"/>
    </g>
    
    <!-- Texto "Concurseiro" -->
    <g id="text" transform="translate(55, 35)">
      <text 
        font-family="'Outfit', 'Arial Black', sans-serif" 
        font-size="22" 
        font-weight="800"
        fill="#004AAD"
        letter-spacing="-0.5">
        <tspan>Concurseiro</tspan>
      </text>
    </g>
    
    <!-- Elemento decorativo orgânico -->
    <g id="decoration">
      <circle cx="180" cy="15" r="3" fill="#FFBD00" opacity="0.6"/>
      <circle cx="185" cy="20" r="2" fill="#FF7000" opacity="0.5"/>
      <circle cx="182" cy="25" r="2.5" fill="#004AAD" opacity="0.4"/>
    </g>
    
  </g>
  
  <!-- Versão alternativa compacta (ícone apenas) -->
  <g id="icon-only" style="display:none">
    <use xlink:href="#icon" transform="translate(80, 10) scale(1.2)"/>
  </g>
  
</svg>